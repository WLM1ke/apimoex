name: tests

on: [push, pull_request]

jobs:
  tests:
    name: Tests
    runs-on: macos-latest

    steps:
      - name: Checkout apimoex
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Setup venv, install tools and dependencies
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test
