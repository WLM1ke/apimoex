[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apimoex"
version = "1.6.0"
description = "MOEX ISS API"
authors = [{ name = "Mikhail Korotkov aka WLMike", email = "wlmike@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.15"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31.0"]


[dependency-groups]
dev = [
    "pandas>=2.1.4",
    "pandas-stubs>=2.2.2.240807",
    "basedpyright>=1.40.2",
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "sphinx>=7.2.6",
    "aiohttp_theme>=0.1.6",
]

[tool.basedpyright]
include = ["apimoex", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "all"
failOnWarnings = true
enableTypeIgnoreComments = false
reportImplicitOverride = "none"
reportUnannotatedClassAttribute = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-W",
    "error",
    "--cov=apimoex",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["apimoex"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]

ignore = [
    # ruff format owns these: the formatter adds and removes commas, quotes,
    # indentation and docstring elements, so the linter must not fight it.
    "COM812", # Missing-trailing-comma
    "COM819", # Prohibited-trailing-comma
    "D203",   # One-blank-line-before-class (D203) contradicts D211
    "D206",   # Docstring-tab-indentation
    "D300",   # Triple-single-quotes
    "E111",   # Indentation-with-invalid-multiple (preview only)
    "E114",   # Indentation-with-invalid-multiple-comment (preview only)
    "E117",   # Over-indented (preview only)
    "Q000",   # Bad-quotes-inline-string
    "Q001",   # Bad-quotes-multiline-string
    "Q002",   # Bad-quotes-docstring
    "Q003",   # Avoidable-escaped-quote
    "Q004",   # Unnecessary-escaped-quote
    "W191",   # Tab-indentation

    "CPY001",  # Missing copyright notice at top of file
    "D107",    # Missing docstring in __init__ - the class docstring documents it
    "D213",    # Multi-line-summary-first-line (D212) and multi-line-summary-second-line (D213) are incompatible
    "PLR0913", # Too many arguments in function definition - required in this library
    "PLR0917", # Too many positional arguments - required in this library
    "RUF001",  # Ambiguous-unicode-character-string - russian
    "RUF002",  # Ambiguous-unicode-character-docstring - russian
    "RUF003",  # Ambiguous-unicode-character-comment - russian
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "D103",    # Missing docstring in public function - the test name is the documentation
    "PLR2004", # Magic value used in comparison - expected values are the test data
    "S101",    # Use of `assert` detected - assertions are how tests assert
    "SLF001",  # Private member accessed - the tests exercise the private query builders
]
